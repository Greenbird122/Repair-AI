name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Don't burn minutes on superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the local toolchain (Flutter 3.47.5 stable / Dart 3.13.x).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          # Phase 0 live smoke: proves production still answers
          # /api/app-version/ so backend death fails CI, not users.
          LIVE_SMOKE: "1"
